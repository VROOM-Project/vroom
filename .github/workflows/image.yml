name: Publish vroom image
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication to avoid concurrent shared-tag updates.
concurrency:
  group: vroom-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Image name
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build image
        env:
          ARCH: ${{ matrix.arch }}
        run: docker build --platform "linux/$ARCH" --provenance=false -t "$IMAGE:sha-$GITHUB_SHA-$ARCH" .
      - name: Smoke test
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker run -d --name vroom -p 3000:3000 "$IMAGE:sha-$GITHUB_SHA-$ARCH"
          for i in $(seq 1 30); do curl -fs http://localhost:3000/health && break; sleep 1; done
          # Vehicle with neither start nor end, custom matrix: no router needed.
          curl -fs -X POST -H 'Content-Type: application/json' \
            -d '{"vehicles":[{"id":1}],"jobs":[{"id":1,"location_index":1},{"id":2,"location_index":2}],"matrices":{"car":{"durations":[[0,100,200],[100,0,100],[200,100,0]]}}}' \
            http://localhost:3000/ | tee result.json
          jq -e '.code == 0 and .summary.cost == 100 and (.unassigned | length) == 0' result.json
          docker rm -f vroom
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push architecture image
        if: github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
        run: docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:sha-$GITHUB_SHA" \
            --tag "$image:$GITHUB_REF_NAME" \
            --tag "$image:latest" \
            "$image:sha-$GITHUB_SHA-amd64" \
            "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA"
