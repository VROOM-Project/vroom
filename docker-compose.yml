services:
  osrm:
    image: osrm/osrm-backend
    container_name: osrm-portugal
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: >
      osrm-routed
      --algorithm mld
      --max-table-size 2000
      /data/portugal-latest.osrm
    # This image has no curl/wget/nc, but does have bash, so probe via /dev/tcp.
    # The probe MUST send a real HTTP request: a bare TCP open/close makes
    # osrm-routed exit cleanly (exit 0), which restart:unless-stopped then
    # hides as a silent restart loop.
    # Single-quoted YAML keeps the backslashes literal so printf expands them.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/5000 && printf "GET /nearest/v1/car/-9.15,38.72 HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  vroom:
    build:
      context: ./vroom-custom
    image: logistic-vroom-route-penalty:local
    container_name: vroom
    ports:
      - "3000:3000"
    environment:
      # Already the default; kept to make the intent explicit.
      - VROOM_ROUTER=osrm
    volumes:
      - ./vroom-conf:/conf
    depends_on:
      osrm:
        condition: service_healthy
    restart: unless-stopped
